<!DOCTYPE html>
<html lang="cs">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>kb-zpěvník</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
			max-width: 40em;
			margin: 3em auto;
			padding: 0 1em;
			line-height: 1.5;
			color: #222;
		}
		h1 { font-size: 1.8em; margin-bottom: 0.2em; }
		p.tagline { color: #666; margin-top: 0; }
		ul.downloads { list-style: none; padding: 0; }
		ul.downloads li { margin: 0.6em 0; }
		ul.downloads a {
			display: inline-block;
			padding: 0.5em 1em;
			border: 1px solid #ccc;
			border-radius: 6px;
			text-decoration: none;
			color: #222;
		}
		ul.downloads a:hover { background: #f0f0f0; }
		footer { margin-top: 3em; color: #888; font-size: 0.9em; }
		footer a { color: inherit; }
	</style>
</head>
<body>
	<h1>kb-zpěvník</h1>
	<p class="tagline">Osobní zpěvník s akordy</p>

	<ul class="downloads">
		<li><a href="kb_zpevnik.pdf">Stáhnout zpěvník (PDF)</a></li>
		<li><a href="kb_zpevnik.tablet.pdf">Stáhnout ořezanou verzi pro tablet (PDF)</a></li>
	</ul>

	<footer>
		<p>Zdrojové kódy a písně na <a href="https://github.com/karel-brinda/kb-zpevnik">GitHubu</a>.</p>
	</footer>
</body>
</html>
